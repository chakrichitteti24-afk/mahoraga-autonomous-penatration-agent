  <path d="M32 16L44 23.5V38.5L32 46L20 38.5V23.5L32 16Z" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8" />
  
  <!-- Central Pulse Nexus -->
  <circle cx="32" cy="31" r="5" fill="#0066FF" filter="url(#glow)" />
  <circle cx="32" cy="31" r="2.5" fill="#FFFFFF" />

  <!-- Alignment Guides -->
  <line x1="32" y1="8" x2="32" y2="16" stroke="#00F0FF" stroke-width="1.5" opacity="0.6" />
  <line x1="32" y1="46" x2="32" y2="54" stroke="#0066FF" stroke-width="1.5" opacity="0.6" />
</svg>