<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#002A80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="14" fill="#02050A" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  
  <!-- Outer Geometric Shield / Hexagon -->
  <path d="M32 8L52 18V36L32 54L12 36V18L32 8Z" stroke="url(#cyberGrad)" stroke-width="2" stroke-linejoin="round" fill="rgba(0,102,255,0.06)" />
  
